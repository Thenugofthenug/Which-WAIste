# Free trial only: database expires after 30 days. Review plans before class use.
services:
  - type: web
    name: which-waiste-lava
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: off
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: which-waiste-data
          property: connectionString
      - key: APP_ENV
        value: production
databases:
  - name: which-waiste-data
    plan: free
    region: oregon
    databaseName: waiste
    user: waiste
